# GitLab CI for JotLine
#
# - Pipelines run only for merge requests, the default branch (main), and tags.
# - test:    check-docs (ai-dev-standard), unit tests, type check (lint), release check (version tags only)
# - build:   production build; main.js / manifest.json are kept as artifacts for 30 days
# - release: upload to the Generic Package Registry and create a GitLab release (version tags vX.Y.Z only)
#
# Jobs that need Node.js use an explicit Node.js image, because the runner's default image (plain Alpine)
# has no Node.js / npm.

include:
  - local: ci/ai-standard.gitlab-ci.yml   # ai-standard:check-docs (stage: test)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: never   # e.g. pushes to item/* branches without a merge request

stages:
  - test
  - build
  - release

# Common settings for jobs that need Node.js and the npm dependencies
.node:
  image: node:24-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

# Rules for jobs that run only for version tags (vX.Y.Z)
.version-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

test:
  extends: .node
  stage: test
  script:
    - npm test

lint:
  extends: .node
  stage: test
  script:
    - npx tsc --noEmit

release:check:
  extends:
    - .node
    - .version-tag
  stage: test
  # The release script uses only Node.js built-ins, so the npm dependencies are not needed.
  cache: []
  before_script: []
  script:
    - node scripts/release.mjs check "$CI_COMMIT_TAG"

build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    name: "jotline-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - main.js
      - manifest.json
    expire_in: 30 days

release:publish:
  extends:
    - .node
    - .version-tag
  stage: release
  # Uses main.js / manifest.json from the build job's artifacts (passed from the earlier stage).
  cache: []
  before_script: []
  script:
    - node scripts/release.mjs publish "$CI_COMMIT_TAG"
